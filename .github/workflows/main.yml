
name: Build AEX for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Verifier les fichiers
        run: |
          test -f aex.py
          test -f logo.ico
          test -f fichier.ico

      - name: Convertir les icones en ICNS
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          def create_icns(source, destination):
              image = Image.open(source).convert("RGBA")
              iconset = Path(destination).with_suffix(".iconset")
              iconset.mkdir(parents=True, exist_ok=True)

              sizes = [
                  ("icon_16x16.png", 16),
                  ("icon_16x16@2x.png", 32),
                  ("icon_32x32.png", 32),
                  ("icon_32x32@2x.png", 64),
                  ("icon_128x128.png", 128),
                  ("icon_128x128@2x.png", 256),
                  ("icon_256x256.png", 256),
                  ("icon_256x256@2x.png", 512),
                  ("icon_512x512.png", 512),
                  ("icon_512x512@2x.png", 1024),
              ]

              for filename, size in sizes:
                  resized = image.resize(
                      (size, size),
                      Image.Resampling.LANCZOS
                  )
                  resized.save(iconset / filename)

          create_icns("logo.ico", "logo.icns")
          create_icns("fichier.ico", "fichier.icns")
          PY

          iconutil -c icns logo.iconset -o logo.icns
          iconutil -c icns fichier.iconset -o fichier.icns

      - name: Compiler l'interpreteur AEX
        run: |
          pyinstaller \
            --onefile \
            --console \
            --name aex \
            aex.py

      - name: Creer AEX.app
        run: |
          mkdir -p build_app

          cat > build_app/AEX.applescript <<'APPLESCRIPT'
          on open fileList
              repeat with selectedFile in fileList
                  set filePath to POSIX path of selectedFile
                  tell application "Terminal"
                      activate
                      do script "/usr/local/bin/aex " & quoted form of filePath
                  end tell
              end repeat
          end open

          on run
              tell application "Terminal"
                  activate
                  do script "echo 'Pour utiliser AEX : aex fichier.aex'"
              end tell
          end run
          APPLESCRIPT

          osacompile \
            -o build_app/AEX.app \
            build_app/AEX.applescript

          mkdir -p build_app/AEX.app/Contents/Resources
          cp logo.icns build_app/AEX.app/Contents/Resources/logo.icns
          cp fichier.icns build_app/AEX.app/Contents/Resources/fichier.icns

          python - <<'PY'
          import plistlib

          path = "build_app/AEX.app/Contents/Info.plist"

          with open(path, "rb") as f:
              info = plistlib.load(f)

          info["CFBundleIdentifier"] = "com.misteriouscreator.aex"
          info["CFBundleName"] = "AEX"
          info["CFBundleDisplayName"] = "AEX"
          info["CFBundleIconFile"] = "logo.icns"
          info["CFBundleDocumentTypes"] = [{
              "CFBundleTypeName": "Fichier AEX",
              "CFBundleTypeExtensions": ["aex"],
              "CFBundleTypeRole": "Editor",
              "CFBundleTypeIconFile": "fichier.icns",
              "LSHandlerRank": "Owner",
              "LSItemContentTypes": ["com.misteriouscreator.aex"]
          }]
          info["UTExportedTypeDeclarations"] = [{
              "UTTypeIdentifier": "com.misteriouscreator.aex",
              "UTTypeDescription": "Fichier AEX",
              "UTTypeConformsTo": ["public.data"],
              "UTTypeTagSpecification": {
                  "public.filename-extension": ["aex"]
              }
          }]

          with open(path, "wb") as f:
              plistlib.dump(info, f)
          PY

      - name: Preparer l'installateur
        run: |
          mkdir -p pkgroot/usr/local/bin
          mkdir -p pkgroot/Applications

          cp dist/aex pkgroot/usr/local/bin/aex
          chmod 755 pkgroot/usr/local/bin/aex

          cp -R build_app/AEX.app pkgroot/Applications/AEX.app

      - name: Construire le PKG
        run: |
          pkgbuild \
            --root pkgroot \
            --identifier com.misteriouscreator.aex \
            --version 1.0.0 \
            --install-location / \
            AEX-macOS.pkg

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: AEX-macOS-installer
          path: AEX-macOS.pkg
